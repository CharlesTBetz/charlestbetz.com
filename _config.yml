title: "Charles T. Betz"
tagline: "Telling stories with music, in a universe of simultaneous time"
description: "Charles T. Betz is a composer, lyricist, arranger, and writer based in Minneapolis. Musical theater and choral works."
author:
  name: "Charles T. Betz"
  email: "char@charlestbetz.com"
url: "https://www.charlestbetz.com"
baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "pages"
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

social:
  bluesky: "https://bsky.app/profile/charlestbetz.bsky.social"
  instagram: "https://www.instagram.com/charlesbetz"
  linkedin: "https://www.linkedin.com/in/charlestbetz/"
  youtube: "https://www.youtube.com/@charlestbetzmusic"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - node_modules/
  - _dev/
  - DONE.txt
  - WEBMASTER.md
  - CARD-CONVERSION-SUMMARY.md
  - MIGRATION-SUMMARY.md
  - QUICKSTART.md
  - DEPLOYMENT.md
